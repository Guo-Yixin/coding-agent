<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1420" viewBox="0 0 1920 1420" role="img" aria-labelledby="title desc">
<title id="title">CODING System Architecture</title>
<desc id="desc">CODING request intake, asynchronous task scheduling, agent execution, persistence, and isolated evaluation.</desc>
<defs>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14213d"/><stop offset="1" stop-color="#3158a8"/></linearGradient>
  <linearGradient id="eval" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7f8fc"/><stop offset="1" stop-color="#f0f5fb"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#23395b" flood-opacity=".08"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#657da6"/></marker>
  <marker id="tealArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#168e91"/></marker>
  <style>
    text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#192942}
    .title{font-size:42px;font-weight:750;fill:#fff}.subtitle{font-size:21px;fill:#d8e5ff}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;fill:#91a5cc}
    .section{font-size:18px;font-weight:750;letter-spacing:1px;fill:#5b6d88}.head{font-size:22px;font-weight:720}.body{font-size:16px;fill:#66758e}.note{font-size:14px;fill:#74839a}
    .panel{fill:#fff;stroke:#e1e7f0;stroke-width:1.5}.card{fill:#fff;stroke:#d8e1ee;stroke-width:1.7}.blue{fill:#f3f6ff;stroke:#aabce5;stroke-width:1.8}.mint{fill:#eff9f7;stroke:#9bd3ca;stroke-width:1.8}.amber{fill:#fff8ed;stroke:#e9c78f;stroke-width:1.8}.line{fill:none;stroke:#7286a8;stroke-width:3;marker-end:url(#arrow)}.flow{fill:none;stroke:#168e91;stroke-width:3.2;marker-end:url(#tealArrow)}.dash{fill:none;stroke:#aab6c8;stroke-width:2;stroke-dasharray:8 8}
  </style>
</defs>
<rect width="1920" height="1420" fill="#f4f6fa"/>
<rect x="40" y="32" width="1840" height="152" rx="28" fill="url(#hero)"/>
<text x="88" y="91" class="title">CODING · SYSTEM ARCHITECTURE</text>
<text x="90" y="128" class="subtitle">An asynchronous AI coding workspace for real Git repositories</text>
<text x="90" y="160" class="eyebrow" fill="#d8e5ff">REQUEST INTAKE → DURABLE QUEUE → PARALLEL RUNS → STREAMING → VERIFIED DELIVERY</text>

<rect x="40" y="214" width="1840" height="510" rx="24" class="panel"/>
<text x="78" y="256" class="section">01 · APPLICATION RUNTIME</text><text x="1580" y="256" class="note">Current implementation</text>
<g filter="url(#shadow)"><rect x="78" y="290" width="300" height="112" rx="18" class="blue"/><rect x="458" y="290" width="330" height="112" rx="18" class="blue"/><rect x="868" y="290" width="360" height="112" rx="18" class="mint"/><rect x="1308" y="290" width="520" height="112" rx="18" class="mint"/></g>
<text x="108" y="337" class="head">Developer / User</text><text x="108" y="371" class="body">Create chats · submit tasks · review results</text>
<text x="488" y="337" class="head">Vue 3 Workspace</text><text x="488" y="371" class="body">Projects · chats · model selection · live status</text>
<text x="898" y="337" class="head">FastAPI Ingress</text><text x="898" y="371" class="body">Validate · create runs · stream over SSE</text>
<text x="1338" y="337" class="head">Durable Run Queue + Worker Pool</text><text x="1338" y="371" class="body">Atomic claims · concurrency limits · leases · recovery</text>
<path d="M378 346H458" class="line"/><path d="M788 346H868" class="line"/><path d="M1228 346H1308" class="flow"/>

<text x="80" y="456" class="section">TASK EXECUTION</text>
<g filter="url(#shadow)"><rect x="78" y="480" width="340" height="142" rx="18" class="blue"/><rect x="488" y="480" width="380" height="142" rx="18" class="mint"/><rect x="938" y="480" width="400" height="142" rx="18" class="blue"/><rect x="1408" y="480" width="420" height="142" rx="18" class="amber"/></g>
<text x="108" y="526" class="head">Concurrent Run Workers</text><text x="108" y="560" class="body">Independent runs · cancellable · resumable</text><text x="108" y="592" class="note">Claimed from the durable queue</text>
<text x="518" y="526" class="head">Primary Agent · LangGraph</text><text x="518" y="560" class="body">Intent routing · planning · tools · synthesis</text><text x="518" y="592" class="note">Checkpoints support interrupted-run recovery</text>
<text x="968" y="526" class="head">Repository Context &amp; Tools</text><text x="968" y="560" class="body">CodeGraph / grep · Git · terminal · tests</text><text x="968" y="592" class="note">Guarded files · isolated workspace · reviewable diff</text>
<text x="1438" y="526" class="head">Specialist SubAgents</text><text x="1438" y="560" class="body">Focused analysis · read-only review · collaboration</text><text x="1438" y="592" class="note">Results are synthesized by the primary agent</text>
<path d="M418 551H488" class="flow"/><path d="M868 551H938" class="line"/><path d="M1338 551H1408" class="line"/>
<path d="M1138 622V660H678V622" class="dash"/><text x="823" y="654" class="note">Tool results return to the agent for the next step</text>

<rect x="40" y="752" width="1840" height="226" rx="24" class="panel"/>
<text x="78" y="795" class="section">02 · STATE, EVENTS &amp; MEMORY</text>
<g filter="url(#shadow)"><rect x="78" y="822" width="390" height="112" rx="18" class="blue"/><rect x="528" y="822" width="390" height="112" rx="18" class="blue"/><rect x="978" y="822" width="390" height="112" rx="18" class="mint"/><rect x="1428" y="822" width="400" height="112" rx="18" class="card"/></g>
<text x="108" y="868" class="head">SQLite / PostgreSQL</text><text x="108" y="902" class="body">Projects · chats · runs · messages · events</text>
<text x="558" y="868" class="head">LangGraph Checkpoints</text><text x="558" y="902" class="body">Execution state · resume cursor · memory</text>
<text x="1008" y="868" class="head">SSE Event Stream</text><text x="1008" y="902" class="body">Steps · tool output · heartbeat · terminal state</text>
<text x="1458" y="868" class="head">Workspace &amp; Deliverables</text><text x="1458" y="902" class="body">Repository files · patches · branch / PR status</text>
<path d="M248 822V784H1488V822" class="dash"/><text x="830" y="779" class="note">Run state and traces persist; clients subscribe by chat</text>

<rect x="40" y="1006" width="1840" height="362" rx="24" fill="url(#eval)" stroke="#dce4ef" stroke-width="1.5"/>
<text x="78" y="1050" class="section">03 · REPRODUCIBLE AGENT EVALUATION</text><text x="1560" y="1050" class="note">Separate from everyday coding runs</text>
<g filter="url(#shadow)"><rect x="78" y="1100" width="300" height="132" rx="18" class="blue"/><rect x="458" y="1100" width="300" height="132" rx="18" class="blue"/><rect x="838" y="1100" width="300" height="132" rx="18" class="mint"/><rect x="1218" y="1100" width="270" height="132" rx="18" class="amber"/><rect x="1568" y="1100" width="260" height="132" rx="18" class="blue"/></g>
<text x="108" y="1148" class="head">Pinned Cases</text><text x="108" y="1182" class="body">Target revisions · checks</text>
<text x="488" y="1148" class="head">Eval Runner</text><text x="488" y="1182" class="body">Pinned agent · replay orchestration</text>
<text x="868" y="1148" class="head">OpenSandbox</text><text x="868" y="1182" class="body">Isolated repo · test execution</text>
<text x="1248" y="1148" class="head">Scorers &amp; Checks</text><text x="1248" y="1182" class="body">Target · regression · hidden tests</text>
<text x="1598" y="1148" class="head">Report &amp; Evidence</text><text x="1598" y="1182" class="body">Patch · trace · tokens · latency</text>
<path d="M378 1166H458" class="line"/><path d="M758 1166H838" class="flow"/><path d="M1138 1166H1218" class="line"/><path d="M1488 1166H1568" class="line"/>
<rect x="78" y="1270" width="1750" height="52" rx="14" fill="#fff" stroke="#e0e6ef"/><circle cx="108" cy="1296" r="7" fill="#168e91"/><text x="128" y="1302" class="body">Reports capture revisions, test outcomes, and execution evidence for replay and comparison. OpenSandbox isolates Eval; it is not the runtime for every coding task.</text>
</svg>
