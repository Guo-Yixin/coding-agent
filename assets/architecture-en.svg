<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title desc">
  <title id="title">CODING system architecture</title>
  <desc id="desc">Current application, agent execution, persistence, sandbox evaluation, and a dashed scale-out deployment target.</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#18264f"/><stop offset="1" stop-color="#3459c5"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6881b6"/></marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b9ab7"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#17233d}
      .title{font-size:34px;font-weight:750;fill:#fff}.subtitle{font-size:17px;fill:#dbe5ff}
      .section{font-size:19px;font-weight:750;letter-spacing:.4px;fill:#34435e}
      .head{font-size:19px;font-weight:700}.body{font-size:15px;fill:#53627b}.tiny{font-size:13px;fill:#66758e}
      .panel{fill:#fff;stroke:#dbe3f0;stroke-width:1.5}.node{fill:#f8faff;stroke:#cbd6e9;stroke-width:1.5}
      .blue{fill:#eef3ff;stroke:#92a8ed}.teal{fill:#edf9f8;stroke:#91d1cb}.amber{fill:#fff7e9;stroke:#f0c878}
      .arrow{fill:none;stroke:#6881b6;stroke-width:2.5;marker-end:url(#arrow)}
      .softarrow{fill:none;stroke:#8b9ab7;stroke-width:2;marker-end:url(#arrow-light)}
      .dash{fill:#fbfcff;stroke:#8896b3;stroke-width:2;stroke-dasharray:9 7}
    </style>
  </defs>
  <rect width="1600" height="1300" rx="26" fill="#f2f5fb"/>
  <rect x="40" y="28" width="1520" height="76" rx="18" fill="url(#hero)"/>
  <text x="72" y="67" class="title">CODING · System Architecture</text>
  <text x="74" y="91" class="subtitle">Repository-aware agent · persistent sessions · isolated, reproducible evaluation</text>
  <line x1="1210" y1="55" x2="1260" y2="55" stroke="#dbe5ff" stroke-width="3"/>
  <text x="1272" y="61" class="subtitle">Current path</text>
  <line x1="1390" y1="55" x2="1440" y2="55" stroke="#dbe5ff" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="1450" y="61" class="subtitle">Target</text>

  <rect x="40" y="120" width="1520" height="455" rx="20" class="panel"/>
  <text x="68" y="155" class="section">01 · PRODUCT RUNTIME</text>
  <rect x="70" y="180" width="245" height="100" rx="14" class="node blue"/>
  <text x="92" y="216" class="head">Vue 3 workspace</text><text x="92" y="244" class="body">Task input · plans · diffs</text><text x="92" y="265" class="body">Live status and history</text>
  <rect x="370" y="180" width="265" height="100" rx="14" class="node blue"/>
  <text x="392" y="216" class="head">FastAPI application</text><text x="392" y="244" class="body">HTTP APIs · approval actions</text><text x="392" y="265" class="body">SSE event endpoint</text>
  <rect x="690" y="180" width="280" height="100" rx="14" class="node amber"/>
  <text x="712" y="216" class="head">Multi-layer intent router</text><text x="712" y="244" class="body">LLM classification + rule fallback</text><text x="712" y="265" class="body">Planning · coding · review · QA</text>
  <rect x="1025" y="180" width="500" height="100" rx="14" class="node blue"/>
  <text x="1048" y="216" class="head">Primary Agent · DeepAgents / LangGraph</text><text x="1048" y="244" class="body">Coordinates task execution, delegates work, and summarizes results</text><text x="1048" y="265" class="body">Checkpoint-backed runs · user approval and resume</text>
  <path d="M315 230H360" class="arrow"/><path d="M635 230H680" class="arrow"/><path d="M970 230H1015" class="arrow"/>

  <rect x="70" y="330" width="330" height="112" rx="14" class="node"/>
  <text x="92" y="366" class="head">Dynamic agent assembly</text><text x="92" y="394" class="body">Prompt · tools · permissions</text><text x="92" y="416" class="body">Skills and task context</text>
  <rect x="440" y="330" width="300" height="112" rx="14" class="node teal"/>
  <text x="462" y="366" class="head">Specialist subagents</text><text x="462" y="394" class="body">Task breakdown · analysis · Reviewer</text><text x="462" y="416" class="body">Action decisions and findings return</text>
  <rect x="780" y="330" width="330" height="112" rx="14" class="node amber"/>
  <text x="802" y="366" class="head">Tools and safety middleware</text><text x="802" y="394" class="body">Path / input checks · tool recovery</text><text x="802" y="416" class="body">Model, tool-call, and time limits</text>
  <rect x="1150" y="330" width="375" height="112" rx="14" class="node blue"/>
  <text x="1172" y="366" class="head">Streaming and state</text><text x="1172" y="394" class="body">Buffered events → stable SSE protocol</text><text x="1172" y="416" class="body">PostgreSQL / SQLite checkpoint + task state</text>
  <path d="M1275 280V305H235V320" class="softarrow"/>
  <path d="M400 386H430" class="arrow"/><path d="M740 386H770" class="arrow"/><path d="M1110 386H1140" class="arrow"/>
  <path d="M590 442V474H1010V442" class="softarrow"/>
  <rect x="300" y="486" width="1000" height="58" rx="15" fill="#18264f"/>
  <text x="800" y="522" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Plan → implement → review → fix → verify → explain the result</text>

  <rect x="40" y="600" width="1520" height="258" rx="20" class="panel"/>
  <text x="68" y="637" class="section">02 · REPOSITORY, EXECUTION AND PERSISTENCE</text>
  <rect x="65" y="668" width="275" height="145" rx="14" class="node blue"/>
  <text x="86" y="704" class="head">Code intelligence</text><text x="86" y="734" class="body">CodeGraph + grep hybrid</text><text x="86" y="759" class="body">Repository and PR context</text><text x="86" y="786" class="tiny">Targeted retrieval for agent tools</text>
  <rect x="365" y="668" width="275" height="145" rx="14" class="node"/>
  <text x="386" y="704" class="head">Controlled workspace</text><text x="386" y="734" class="body">Path-scoped file backend</text><text x="386" y="759" class="body">Git branch and repository tools</text><text x="386" y="786" class="tiny">Repository-scoped working copy</text>
  <rect x="665" y="668" width="275" height="145" rx="14" class="node amber"/>
  <text x="686" y="704" class="head">OpenSandbox · Eval path</text><text x="686" y="734" class="body">Isolated command execution</text><text x="686" y="759" class="body">Snapshot upload · patch return</text><text x="686" y="786" class="tiny">Resource cleanup after evaluation</text>
  <rect x="965" y="668" width="275" height="145" rx="14" class="node teal"/>
  <text x="986" y="704" class="head">SQLite / PostgreSQL</text><text x="986" y="734" class="body">Business state · checkpoints</text><text x="986" y="759" class="body">Worker leases · audit events</text><text x="986" y="786" class="tiny">SQLite local default · PostgreSQL option</text>
  <rect x="1265" y="668" width="270" height="145" rx="14" class="node"/>
  <text x="1286" y="704" class="head">Repository memory</text><text x="1286" y="734" class="body">Project structure · test commands</text><text x="1286" y="759" class="body">Decisions · history · PR context</text><text x="1286" y="786" class="tiny">Retrieved across sessions</text>
  <path d="M235 442V570H202V658" class="softarrow"/><path d="M945 442V570H502V658" class="softarrow"/>
  <path d="M945 442V570H802V658" class="softarrow"/><path d="M1335 442V570H1102V658" class="softarrow"/><path d="M1335 442V570H1400V658" class="softarrow"/>

  <rect x="40" y="882" width="1520" height="193" rx="20" class="panel"/>
  <text x="68" y="919" class="section">03 · REPRODUCIBLE AGENT EVAL</text>
  <rect x="68" y="944" width="255" height="94" rx="13" class="node blue"/><text x="88" y="978" class="head">Pinned inputs</text><text x="88" y="1006" class="body">Agent SHA · task · target SHA</text>
  <rect x="368" y="944" width="255" height="94" rx="13" class="node"/><text x="388" y="978" class="head">Isolated case copy</text><text x="388" y="1006" class="body">Fresh workspace per case</text>
  <rect x="668" y="944" width="255" height="94" rx="13" class="node amber"/><text x="688" y="978" class="head">Real Agent run</text><text x="688" y="1006" class="body">Model · tools · retrieval traces</text>
  <rect x="968" y="944" width="255" height="94" rx="13" class="node teal"/><text x="988" y="978" class="head">Acceptance gates</text><text x="988" y="1006" class="body">Target · regression · oracle</text>
  <rect x="1268" y="944" width="255" height="94" rx="13" class="node blue"/><text x="1288" y="978" class="head">Reviewable report</text><text x="1288" y="1006" class="body">Patch · tokens · latency · HTML</text>
  <path d="M323 991H358" class="arrow"/><path d="M623 991H658" class="arrow"/><path d="M923 991H958" class="arrow"/><path d="M1223 991H1258" class="arrow"/>

  <rect x="40" y="1098" width="1520" height="165" rx="20" class="dash"/>
  <text x="68" y="1135" class="section">SCALE-OUT TARGET · DOCUMENTED DESIGN, NOT THE DEFAULT RUNTIME</text>
  <text x="70" y="1175" class="head">2 ASGI nodes</text><text x="70" y="1204" class="body">HTTP / SSE ingress</text>
  <path d="M260 1180H340" class="softarrow"/>
  <text x="360" y="1175" class="head">Redis</text><text x="360" y="1204" class="body">Queue · repo lock · event stream</text>
  <path d="M620 1180H700" class="softarrow"/>
  <text x="720" y="1175" class="head">3 Agent Workers</text><text x="720" y="1204" class="body">Shared PostgreSQL + workspace</text>
  <text x="1110" y="1172" class="body">Stated capacity estimate: ~170 peak requests,</text><text x="1110" y="1200" class="body">~20–30 concurrent coding/review tasks.</text>
  <text x="1110" y="1227" class="tiny">No included load-test report validates these figures.</text>
</svg>
