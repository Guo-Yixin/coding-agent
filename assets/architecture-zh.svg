<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1420" viewBox="0 0 1920 1420" role="img" aria-labelledby="title desc">
<title id="title">CODING 项目架构图</title>
<desc id="desc">展示 CODING 从用户请求、异步任务调度、Agent 执行、仓库工具、持久化到隔离评测的完整架构。</desc>
<defs>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14213d"/><stop offset="1" stop-color="#3158a8"/></linearGradient>
  <linearGradient id="eval" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f7f8fc"/><stop offset="1" stop-color="#f0f5fb"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#23395b" flood-opacity=".08"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#657da6"/></marker>
  <marker id="tealArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#168e91"/></marker>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",Arial,sans-serif;fill:#192942}
    .title{font-size:42px;font-weight:750;fill:#fff}.subtitle{font-size:21px;fill:#d8e5ff}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;fill:#91a5cc}
    .section{font-size:18px;font-weight:750;letter-spacing:1px;fill:#5b6d88}.head{font-size:22px;font-weight:720}.body{font-size:16px;fill:#66758e}.note{font-size:14px;fill:#74839a}.tag{font-size:13px;font-weight:700;fill:#286b70}
    .panel{fill:#fff;stroke:#e1e7f0;stroke-width:1.5}.card{fill:#fff;stroke:#d8e1ee;stroke-width:1.7}.blue{fill:#f3f6ff;stroke:#aabce5;stroke-width:1.8}.mint{fill:#eff9f7;stroke:#9bd3ca;stroke-width:1.8}.amber{fill:#fff8ed;stroke:#e9c78f;stroke-width:1.8}.line{fill:none;stroke:#7286a8;stroke-width:3;marker-end:url(#arrow)}.flow{fill:none;stroke:#168e91;stroke-width:3.2;marker-end:url(#tealArrow)}.dash{fill:none;stroke:#aab6c8;stroke-width:2;stroke-dasharray:8 8}
  </style>
</defs>
<rect width="1920" height="1420" fill="#f4f6fa"/>
<rect x="40" y="32" width="1840" height="152" rx="28" fill="url(#hero)"/>
<text x="88" y="91" class="title">CODING · 项目系统架构</text>
<text x="90" y="128" class="subtitle">面向真实代码仓库的异步 AI 编码工作台 · 可追踪、可审查、可恢复</text>
<text x="90" y="160" class="eyebrow" fill="#d8e5ff">请求接入 → 持久化排队 → 并行执行 → 流式反馈 → 验证交付</text>

<rect x="40" y="214" width="1840" height="510" rx="24" class="panel"/>
<text x="78" y="256" class="section">01 · 应用运行链路</text>
<text x="1580" y="256" class="note">当前实现</text>

<!-- request ingress -->
<g filter="url(#shadow)">
  <rect x="78" y="290" width="300" height="112" rx="18" class="blue"/>
  <rect x="458" y="290" width="330" height="112" rx="18" class="blue"/>
  <rect x="868" y="290" width="360" height="112" rx="18" class="mint"/>
  <rect x="1308" y="290" width="520" height="112" rx="18" class="mint"/>
</g>
<text x="108" y="337" class="head">开发者 / 用户</text><text x="108" y="371" class="body">创建会话 · 提交任务 · 查看结果</text>
<text x="488" y="337" class="head">Vue 3 工作台</text><text x="488" y="371" class="body">项目 / 会话 · 模型选择 · 实时状态</text>
<text x="898" y="337" class="head">FastAPI 接入层</text><text x="898" y="371" class="body">校验请求 · 创建 Run · SSE 流式响应</text>
<text x="1338" y="337" class="head">持久化任务队列 + Worker Pool</text><text x="1338" y="371" class="body">原子领取 · 并发上限 · 心跳租约 · 失败恢复</text>
<path d="M378 346H458" class="line"/><path d="M788 346H868" class="line"/><path d="M1228 346H1308" class="flow"/>

<!-- execution pipeline -->
<text x="80" y="456" class="section">任务执行</text>
<g filter="url(#shadow)">
  <rect x="78" y="480" width="340" height="142" rx="18" class="blue"/>
  <rect x="488" y="480" width="380" height="142" rx="18" class="mint"/>
  <rect x="938" y="480" width="400" height="142" rx="18" class="blue"/>
  <rect x="1408" y="480" width="420" height="142" rx="18" class="amber"/>
</g>
<text x="108" y="526" class="head">并发 Run Worker</text><text x="108" y="560" class="body">每个任务独立运行 · 可取消 / 可恢复</text><text x="108" y="592" class="note">由持久化队列领取任务</text>
<text x="518" y="526" class="head">主 Agent · LangGraph</text><text x="518" y="560" class="body">意图路由 · 计划 · 工具调用 · 汇总</text><text x="518" y="592" class="note">checkpoint 支持中断后续跑</text>
<text x="968" y="526" class="head">仓库上下文与工具</text><text x="968" y="560" class="body">CodeGraph / grep · Git · 终端 · 测试</text><text x="968" y="592" class="note">受控文件访问 · 工作区隔离 · 可审查 diff</text>
<text x="1438" y="526" class="head">专业 SubAgent</text><text x="1438" y="560" class="body">专项分析 · 只读审查 · 并行协作</text><text x="1438" y="592" class="note">结果由主 Agent 汇总</text>
<path d="M418 551H488" class="flow"/><path d="M868 551H938" class="line"/><path d="M1338 551H1408" class="line"/>
<path d="M1138 622V660H678V622" class="dash"/><text x="823" y="654" class="note">工具执行结果返回 Agent · 迭代直到完成</text>

<!-- storage & events -->
<rect x="40" y="752" width="1840" height="226" rx="24" class="panel"/>
<text x="78" y="795" class="section">02 · 状态、事件与记忆</text>
<g filter="url(#shadow)">
  <rect x="78" y="822" width="390" height="112" rx="18" class="blue"/>
  <rect x="528" y="822" width="390" height="112" rx="18" class="blue"/>
  <rect x="978" y="822" width="390" height="112" rx="18" class="mint"/>
  <rect x="1428" y="822" width="400" height="112" rx="18" class="card"/>
</g>
<text x="108" y="868" class="head">SQLite / PostgreSQL</text><text x="108" y="902" class="body">项目 · 会话 · Run · 消息 · 事件</text>
<text x="558" y="868" class="head">LangGraph Checkpoint</text><text x="558" y="902" class="body">执行状态 · 恢复游标 · 长期记忆</text>
<text x="1008" y="868" class="head">SSE 事件流</text><text x="1008" y="902" class="body">步骤 · 工具输出 · 心跳 · 完成 / 失败</text>
<text x="1458" y="868" class="head">工作区与交付物</text><text x="1458" y="902" class="body">仓库文件 · 补丁 · 分支 / PR 状态</text>
<path d="M248 822V784H1488V822" class="dash"/><text x="830" y="779" class="note">Run 状态与执行轨迹持久化，前端按会话订阅</text>

<!-- eval lane -->
<rect x="40" y="1006" width="1840" height="362" rx="24" fill="url(#eval)" stroke="#dce4ef" stroke-width="1.5"/>
<text x="78" y="1050" class="section">03 · Agent Eval 可复现评测链路</text>
<text x="1560" y="1050" class="note">独立于日常编码任务</text>
<g filter="url(#shadow)">
  <rect x="78" y="1100" width="300" height="132" rx="18" class="blue"/>
  <rect x="458" y="1100" width="300" height="132" rx="18" class="blue"/>
  <rect x="838" y="1100" width="300" height="132" rx="18" class="mint"/>
  <rect x="1218" y="1100" width="270" height="132" rx="18" class="amber"/>
  <rect x="1568" y="1100" width="260" height="132" rx="18" class="blue"/>
</g>
<text x="108" y="1148" class="head">固定案例集</text><text x="108" y="1182" class="body">目标版本 · 验收命令</text>
<text x="488" y="1148" class="head">Eval Runner</text><text x="488" y="1182" class="body">固定 Agent · 复跑编排</text>
<text x="868" y="1148" class="head">OpenSandbox</text><text x="868" y="1182" class="body">隔离候选仓库 · 执行测试</text>
<text x="1248" y="1148" class="head">评分与检查</text><text x="1248" y="1182" class="body">目标 · 回归 · 隐藏验收</text>
<text x="1598" y="1148" class="head">报告与证据</text><text x="1598" y="1182" class="body">补丁 · 轨迹 · Token · 耗时</text>
<path d="M378 1166H458" class="line"/><path d="M758 1166H838" class="flow"/><path d="M1138 1166H1218" class="line"/><path d="M1488 1166H1568" class="line"/>
<rect x="78" y="1270" width="1750" height="52" rx="14" fill="#fff" stroke="#e0e6ef"/>
<circle cx="108" cy="1296" r="7" fill="#168e91"/><text x="128" y="1302" class="body">评测报告记录版本、测试结果和运行证据，用于复现与版本对比；OpenSandbox 是 Eval 隔离后端，不代表所有常规任务都在沙箱运行。</text>
</svg>
