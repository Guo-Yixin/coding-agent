[project]
name = "coding"
version = "0.1.0"
description = "CODING backend"
requires-python = ">=3.14"
dependencies = [
  "deepagents>=0.6.11",
  "fastapi>=0.138.0",
  "uvicorn>=0.49.0",
  "langchain-openai>=1.3.2",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "langgraph-checkpoint-postgres>=3.0.0",
  "psycopg[binary,pool]>=3.2.0",
  "python-dotenv>=1.2.2",
  "requests>=2.32.0",
  "zhipuai>=2.1.5",
]

[tool.setuptools.packages.find]
include = ["agent*"]
